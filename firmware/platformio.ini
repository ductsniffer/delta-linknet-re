; LINKnet listener - ESP32-S3 firmware that only LISTENS to the thermostat bus.
;
;   ./test.ps1                unit tests and the capture replay (no board)
;   ./build.ps1               compile the listener (env:esp32s3)
;   ./pio.ps1 run -e edges    compile the step-3 edge counter
;   ./flash.ps1 ...           copy the images out of the container and flash
;
; Everything runs inside docker/Dockerfile.dev; the host has no toolchain.

[platformio]
default_envs = native
src_dir = src
lib_dir = lib

[common]
build_flags =
    -Wall -Wextra -Werror=return-type
    ; --- bus -----------------------------------------------------------
    ;-DLINKNET_BAUD=76800              ; docs/report.md section 1, DIP-set on the thermostats
    ;-DLINKNET_RX_RING=8192            ; bytes buffered between the UART ISR and the decoder
    ;-DLINKNET_RAW_RING=8192           ; bytes kept for the tcp/24 raw stream, 6 B each in RAM
    ; --- console -------------------------------------------------------
    ;-DLINKNET_STATS_PERIOD_S=60       ; one statistics block per minute
    ;-DLINKNET_STALE_S=90              ; a zone without service 13 for this long is flagged
    ; --- status LED ----------------------------------------------------
    ;-DLINKNET_LED_BRIGHTNESS=24       ; 0-255; 0 keeps the LED dark
    ; --- Wi-Fi (settings in NVS, written by env:provision) ---------------
    ;-DLINKNET_HOSTNAME=\"linknet\"    ; mDNS name: linknet.local
    ;-DLINKNET_NET_QUEUE=16384         ; console bytes kept for the tcp/23 client

; ---------------------------------------------------------------- firmware
[env:esp32s3]
platform          = espressif32@6.9.0
board             = esp32-s3-devkitc-1
framework         = arduino
build_unflags     = -std=gnu++11
build_flags       = ${common.build_flags} -std=gnu++17 -DLINKNET_TARGET_ESP32=1 -Iinclude
build_src_filter  = +<main.cpp>
lib_ldf_mode      = chain+
board_build.partitions = default_8MB.csv
monitor_speed     = 115200

; ---------------------------------------------------------------- step 3
; The first image to meet the bus: GPIO 18 as a plain input with pull-up,
; edges counted by the PCNT peripheral, no UART touched at all.
[env:edges]
extends           = env:esp32s3
build_src_filter  = -<*> +<edges/main.cpp>
test_ignore       = *

; ---------------------------------------------------------------- Wi-Fi settings
; Writes the network name, its passphrase and the update password into NVS
; (provision.ps1 drives it over the CH343 port). Touches no bus pin.
[env:provision]
extends           = env:esp32s3
build_src_filter  = -<*> +<provision/main.cpp>
; linknet_esp32 is compiled whole, Esp32Net.cpp included, although this image
; never links it: deep+ finds WebServer and friends from that file too.
lib_ldf_mode      = deep+
test_ignore       = *

; ---------------------------------------------------------------- unit tests
; lib_ignore drops linknet_esp32: the native binary cannot reach any
; hardware adapter, only linknet_core through its ports.
[env:native]
platform          = native
build_flags       = ${common.build_flags} -std=c++17 -O1 -g -DLINKNET_TARGET_NATIVE=1
build_src_filter  = -<*>
test_framework    = unity
lib_ignore        = linknet_esp32
